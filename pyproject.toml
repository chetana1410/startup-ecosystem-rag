[tool.poetry]
name = "EcoAI"
version = "0.1.0"
description = "Two-level retrieval over a document corpus: proposition search, then an agentic rerank."
authors = ["Chetana Tanmayee <chetanatanmayee@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "source"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
streamlit = ">=1.42.0,<2.0.0"
ollama = ">=0.4.7,<0.5.0"
unstructured = {extras = ["pdf"], version = ">=0.16.21,<0.17.0"}
tqdm = ">=4.67.1,<5.0.0"
langchain-community = ">=0.3.17,<0.4.0"
sentence-transformers = ">=3.4.1,<4.0.0"
chromadb = ">=0.6.3,<0.7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"